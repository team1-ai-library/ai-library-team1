<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도서관</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f4f0;
            color: #1a1a18;
            min-height: 100vh;
        }

        header {
            background: #fff;
            border-bottom: 0.5px solid #e0ddd6;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            height: 56px;
        }

        header h1 {
            font-size: 16px;
            font-weight: 500;
            color: #1a1a18;
        }

        header span {
            font-size: 13px;
            color: #888780;
        }

        .tabs {
            display: flex;
            gap: 0;
            padding: 0 2rem;
            background: #fff;
            border-bottom: 0.5px solid #e0ddd6;
        }

        .tab {
            padding: 0 1.25rem;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #888780;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color 0.15s, border-color 0.15s;
            user-select: none;
        }

        .tab.active {
            color: #1a1a18;
            border-bottom-color: #1a1a18;
            font-weight: 500;
        }

        .tab:hover:not(.active) { color: #5f5e5a; }

        .panel { display: none; padding: 2rem; max-width: 900px; margin: 0 auto; }
        .panel.active { display: block; }

        .search-box {
            background: #fff;
            border: 0.5px solid #e0ddd6;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .search-row input {
            flex: 1;
            height: 38px;
            border: 0.5px solid #d3d1c7;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            color: #1a1a18;
            background: #fff;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-row input:focus { border-color: #888780; }

        .search-row button {
            height: 38px;
            padding: 0 18px;
            border: 0.5px solid #b4b2a9;
            border-radius: 8px;
            background: #1a1a18;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .search-row button:hover { background: #2c2c2a; }

        .options-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .seg {
            display: flex;
            border: 0.5px solid #d3d1c7;
            border-radius: 8px;
            overflow: hidden;
        }

        .seg label {
            padding: 0 14px;
            height: 32px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #5f5e5a;
            cursor: pointer;
            border-right: 0.5px solid #d3d1c7;
            transition: background 0.12s, color 0.12s;
            user-select: none;
        }

        .seg label:last-child { border-right: none; }

        .seg input[type=radio] { display: none; }

        .seg input[type=radio]:checked + label {
            background: #1a1a18;
            color: #fff;
        }

        #model-select-wrap {
            display: none;
            align-items: center;
            gap: 8px;
        }

        #model-select-wrap.visible { display: flex; }

        #model-select-wrap select {
            height: 32px;
            border: 0.5px solid #d3d1c7;
            border-radius: 8px;
            padding: 0 10px;
            font-size: 13px;
            color: #1a1a18;
            background: #fff;
            outline: none;
            cursor: pointer;
        }

        .results { margin-top: 1.5rem; }

        .result-meta {
            font-size: 13px;
            color: #888780;
            margin-bottom: 1rem;
        }

        .book-card {
            background: #fff;
            border: 0.5px solid #e0ddd6;
            border-radius: 12px;
            padding: 1rem 1.25rem;
            margin-bottom: 10px;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .book-rank {
            font-size: 13px;
            color: #b4b2a9;
            font-weight: 500;
            min-width: 24px;
            padding-top: 2px;
        }

        .book-info { flex: 1; }

        .book-title {
            font-size: 15px;
            font-weight: 500;
            color: #1a1a18;
            margin-bottom: 4px;
        }

        .book-meta {
            font-size: 13px;
            color: #888780;
            margin-bottom: 6px;
        }

        .book-content {
            font-size: 13px;
            color: #5f5e5a;
            line-height: 1.6;
        }

        .book-why {
            font-size: 13px;
            color: #5f5e5a;
            line-height: 1.6;
            margin-top: 6px;
            padding: 8px 10px;
            background: #f5f4f0;
            border-radius: 6px;
            border-left: 2px solid #b4b2a9;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 4px;
        }

        .badge-relevance {
            background: #e1f5ee;
            color: #0f6e56;
        }

        .badge-rating {
            background: #faeeda;
            color: #854f0b;
        }

        .empty {
            text-align: center;
            padding: 3rem 0;
            color: #b4b2a9;
            font-size: 14px;
        }

        .empty i { font-size: 32px; margin-bottom: 8px; display: block; }

        .loading {
            text-align: center;
            padding: 2rem 0;
            color: #888780;
            font-size: 14px;
            display: none;
        }

        .loading i { animation: spin 1s linear infinite; display: inline-block; margin-right: 6px; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            background: #fcebeb;
            border: 0.5px solid #f7c1c1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #a32d2d;
            display: none;
            margin-top: 1rem;
        }

        /* 챗봇 */
        .chat-wrap {
            background: #fff;
            border: 0.5px solid #e0ddd6;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            min-height: 500px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }

        .msg.user { align-self: flex-end; flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .msg.user .msg-avatar { background: #1a1a18; color: #fff; }
        .msg.bot .msg-avatar { background: #e1f5ee; color: #0f6e56; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .msg.user .msg-bubble {
            background: #1a1a18;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.bot .msg-bubble {
            background: #f5f4f0;
            color: #1a1a18;
            border-bottom-left-radius: 4px;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            padding: 1rem 1.25rem;
            border-top: 0.5px solid #e0ddd6;
            background: #fff;
        }

        .chat-input-row input {
            flex: 1;
            height: 40px;
            border: 0.5px solid #d3d1c7;
            border-radius: 8px;
            padding: 0 14px;
            font-size: 14px;
            color: #1a1a18;
            background: #fff;
            outline: none;
            transition: border-color 0.15s;
        }

        .chat-input-row input:focus { border-color: #888780; }

        .chat-input-row button {
            height: 40px;
            width: 40px;
            border: none;
            border-radius: 8px;
            background: #1a1a18;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .chat-input-row button:hover { background: #2c2c2a; }
        .chat-input-row button:disabled { background: #d3d1c7; cursor: not-allowed; }

        .chat-hint {
            font-size: 12px;
            color: #b4b2a9;
            padding: 0 1.25rem 0.75rem;
            background: #fff;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: #f5f4f0;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #b4b2a9;
            animation: bounce 1.2s ease-in-out infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<header>
    <i class="ti ti-books" style="font-size:20px;" aria-hidden="true"></i>
    <h1>AI 도서관</h1>
    <span>ai-library-team1</span>
</header>

<div class="tabs">
    <div class="tab active" data-tab="search">
        <i class="ti ti-search" aria-hidden="true"></i> 도서 검색
    </div>
    <div class="tab" data-tab="chat">
        <i class="ti ti-message" aria-hidden="true"></i> 도서관 챗봇
    </div>
</div>

<div id="panel-search" class="panel active">
    <div class="search-box">
        <div class="search-row">
            <input type="text" id="search-input" placeholder="검색어를 입력하세요">
            <button onclick="doSearch()">
                <i class="ti ti-search" aria-hidden="true"></i> 검색
            </button>
        </div>
        <div class="options-row">
            <div class="seg">
                <input type="radio" name="search-type" id="t-keyword" value="keyword" checked>
                <label for="t-keyword">키워드</label>
                <input type="radio" name="search-type" id="t-vector" value="vector">
                <label for="t-vector">벡터</label>
                <input type="radio" name="search-type" id="t-hybrid" value="hybrid">
                <label for="t-hybrid">하이브리드</label>
                <input type="radio" name="search-type" id="t-rag" value="rag">
                <label for="t-rag">AI 추천</label>
            </div>
            <div id="model-select-wrap">
                <span style="font-size:13px; color:#888780;">모델</span>
                <select id="model-select">
                    <option value="gemini">Gemini</option>
                    <option value="ollama">Ollama</option>
                </select>
            </div>
        </div>
    </div>

    <div class="loading" id="search-loading">
        <i class="ti ti-refresh"></i> 검색 중...
    </div>
    <div class="error-msg" id="search-error"></div>
    <div class="results" id="search-results">
        <div class="empty">
            <i class="ti ti-book-2" aria-hidden="true"></i>
            검색어를 입력하고 검색하세요
        </div>
    </div>
</div>

<div id="panel-chat" class="panel">
    <div class="chat-wrap">
        <div class="chat-messages" id="chat-messages">
            <div class="msg bot">
                <div class="msg-avatar"><i class="ti ti-robot" aria-hidden="true"></i></div>
                <div class="msg-bubble">안녕하세요! 도서관 챗봇입니다. 도서 소장 여부, 대출 가능 도서관, 인기 도서 등을 물어보세요.</div>
            </div>
        </div>
        <div class="chat-hint">예: "광주에서 토비의 스프링 빌릴 수 있어?" / "이번 주 급상승 도서 알려줘"</div>
        <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="질문을 입력하세요">
            <button id="chat-send" onclick="doChat()">
                <i class="ti ti-send" aria-hidden="true"></i>
            </button>
        </div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080';

    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    document.querySelectorAll('input[name=search-type]').forEach(r => {
        r.addEventListener('change', () => {
            const wrap = document.getElementById('model-select-wrap');
            wrap.classList.toggle('visible', r.value === 'rag' && r.checked);
        });
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });

    document.getElementById('chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') doChat();
    });

    async function doSearch() {
        const keyword = document.getElementById('search-input').value.trim();
        if (!keyword) return;

        const type = document.querySelector('input[name=search-type]:checked').value;
        const model = document.getElementById('model-select').value;

        const loading = document.getElementById('search-loading');
        const error = document.getElementById('search-error');
        const results = document.getElementById('search-results');

        loading.style.display = 'block';
        error.style.display = 'none';
        results.innerHTML = '';

        try {
            let url, data;

            if (type === 'rag') {
                url = `${API}/books/recommend/${model}?question=${encodeURIComponent(keyword)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                data = await res.json();
                renderRag(data, results);
            } else {
                url = `${API}/books/search?keyword=${encodeURIComponent(keyword)}&searchType=${type}&page=0&size=10`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                data = await res.json();
                renderSearch(data, results, type);
            }
        } catch (e) {
            error.textContent = `검색 중 오류가 발생했습니다: ${e.message}`;
            error.style.display = 'block';
            results.innerHTML = '<div class="empty"><i class="ti ti-alert-circle"></i>결과를 불러올 수 없습니다</div>';
        } finally {
            loading.style.display = 'none';
        }
    }

    function renderSearch(data, container, type) {
        const books = data.content || data;
        if (!books || books.length === 0) {
            container.innerHTML = '<div class="empty"><i class="ti ti-book-off"></i>검색 결과가 없습니다</div>';
            return;
        }

        const total = data.totalElements || books.length;
        let html = `<div class="result-meta">${total.toLocaleString()}건 중 ${books.length}건</div>`;

        books.forEach((book, i) => {
            const content = book.bookContent
                ? book.bookContent.substring(0, 150) + (book.bookContent.length > 150 ? '...' : '')
                : '';

            const ratingBadge = book.averageRating && book.reviewCount
                ? `<span class="badge badge-rating"><i class="ti ti-star-filled" style="font-size:11px;" aria-hidden="true"></i> ${book.averageRating.toFixed(1)} (${book.reviewCount}개)</span>`
                : '';

            html += `
        <div class="book-card">
          <div class="book-rank">${i + 1}</div>
          <div class="book-info">
            <div class="book-title">${book.title || ''}</div>
            <div class="book-meta">${book.authorName || ''} · ${book.publisherName || ''} ${ratingBadge}</div>
            ${content ? `<div class="book-content">${content}</div>` : ''}
            ${book.reviewSummary ? `<div class="book-why">${book.reviewSummary.substring(0, 100)}</div>` : ''}
          </div>
        </div>`;
        });

        container.innerHTML = html;
    }

    function renderRag(data, container) {
        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty"><i class="ti ti-book-off"></i>추천 결과가 없습니다</div>';
            return;
        }

        let html = `<div class="result-meta">AI 추천 도서 ${data.length}건</div>`;

        data.forEach((item, i) => {
            html += `
        <div class="book-card">
          <div class="book-rank">${i + 1}</div>
          <div class="book-info">
            <div class="book-title">도서 ID: ${item.id}</div>
            <div class="book-meta">
              <span class="badge badge-relevance">관련성 ${item.relevance}점</span>
            </div>
            <div class="book-why">${item.why || ''}</div>
          </div>
        </div>`;
        });

        container.innerHTML = html;
    }

    async function doChat() {
        const input = document.getElementById('chat-input');
        const question = input.value.trim();
        if (!question) return;

        const messages = document.getElementById('chat-messages');
        const sendBtn = document.getElementById('chat-send');

        input.value = '';
        sendBtn.disabled = true;

        messages.innerHTML += `
      <div class="msg user">
        <div class="msg-avatar">나</div>
        <div class="msg-bubble">${escapeHtml(question)}</div>
      </div>`;

        const typingId = 'typing-' + Date.now();
        messages.innerHTML += `
      <div class="msg bot" id="${typingId}">
        <div class="msg-avatar"><i class="ti ti-robot" aria-hidden="true"></i></div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>`;

        messages.scrollTop = messages.scrollHeight;

        try {
            const res = await fetch(`${API}/test/chat?question=${encodeURIComponent(question)}&model=gemini`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const text = await res.text();

            document.getElementById(typingId)?.remove();

            messages.innerHTML += `
        <div class="msg bot">
          <div class="msg-avatar"><i class="ti ti-robot" aria-hidden="true"></i></div>
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>`;
        } catch (e) {
            document.getElementById(typingId)?.remove();

            messages.innerHTML += `
        <div class="msg bot">
          <div class="msg-avatar"><i class="ti ti-robot" aria-hidden="true"></i></div>
          <div class="msg-bubble" style="color:#a32d2d;">오류가 발생했습니다: ${escapeHtml(e.message)}</div>
        </div>`;
        } finally {
            sendBtn.disabled = false;
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }
</script>
</body>
</html>
